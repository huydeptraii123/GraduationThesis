<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1200" height="780" fill="#ffffff"/>

  <!-- System boundary -->
  <rect x="190" y="60" width="820" height="660" rx="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="600" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#222222">Hệ thống tối ưu cắt nan cửa cuốn</text>

  <!-- Association lines (drawn first so ellipses sit on top of endpoints) -->
  <g stroke="#999999" stroke-width="1.3">
    <!-- PLANNER -->
    <line x1="90" y1="400" x2="380" y2="160"/>
    <line x1="90" y1="400" x2="600" y2="160"/>
    <line x1="90" y1="400" x2="820" y2="160"/>
    <line x1="90" y1="400" x2="380" y2="280"/>
    <line x1="90" y1="400" x2="600" y2="280"/>
    <line x1="90" y1="400" x2="820" y2="280"/>
    <line x1="90" y1="400" x2="380" y2="400"/>
    <line x1="90" y1="400" x2="600" y2="400"/>
    <line x1="90" y1="400" x2="820" y2="400"/>
    <line x1="90" y1="400" x2="380" y2="520"/>
    <line x1="90" y1="400" x2="600" y2="520"/>

    <!-- ADMIN -->
    <line x1="1110" y1="400" x2="380" y2="160"/>
    <line x1="1110" y1="400" x2="600" y2="160"/>
    <line x1="1110" y1="400" x2="820" y2="160"/>
    <line x1="1110" y1="400" x2="820" y2="520"/>
    <line x1="1110" y1="400" x2="380" y2="640"/>
    <line x1="1110" y1="400" x2="600" y2="640"/>
    <line x1="1110" y1="400" x2="820" y2="640"/>
  </g>

  <!-- Use case ellipses -->
  <g>
    <!-- Row 1 -->
    <ellipse cx="380" cy="160" rx="100" ry="38" fill="#1f9e88" stroke="#136656" stroke-width="1.5"/>
    <text x="380" y="165" text-anchor="middle" font-size="13" fill="#ffffff">Đăng nhập</text>

    <ellipse cx="600" cy="160" rx="100" ry="38" fill="#1f9e88" stroke="#136656" stroke-width="1.5"/>
    <text x="600" y="165" text-anchor="middle" font-size="13" fill="#ffffff">Đăng xuất</text>

    <ellipse cx="820" cy="160" rx="100" ry="38" fill="#1f9e88" stroke="#136656" stroke-width="1.5"/>
    <text x="820" y="155" text-anchor="middle" font-size="13" fill="#ffffff">
      <tspan x="820" dy="0">Đổi mật khẩu</tspan>
      <tspan x="820" dy="16">cá nhân</tspan>
    </text>

    <!-- Row 2 -->
    <ellipse cx="380" cy="280" rx="100" ry="38" fill="#1f9e88" stroke="#136656" stroke-width="1.5"/>
    <text x="380" y="275" text-anchor="middle" font-size="13" fill="#ffffff">
      <tspan x="380" dy="0">Nhập đơn hàng</tspan>
      <tspan x="380" dy="16">từ Excel</tspan>
    </text>

    <ellipse cx="600" cy="280" rx="100" ry="38" fill="#1f9e88" stroke="#136656" stroke-width="1.5"/>
    <text x="600" y="275" text-anchor="middle" font-size="13" fill="#ffffff">
      <tspan x="600" dy="0">Xem / tìm / lọc</tspan>
      <tspan x="600" dy="16">đơn hàng</tspan>
    </text>

    <ellipse cx="820" cy="280" rx="100" ry="38" fill="#1f9e88" stroke="#136656" stroke-width="1.5"/>
    <text x="820" y="275" text-anchor="middle" font-size="13" fill="#ffffff">
      <tspan x="820" dy="0">Chỉnh sửa đơn</tspan>
      <tspan x="820" dy="16">hàng thủ công</tspan>
    </text>

    <!-- Row 3 -->
    <ellipse cx="380" cy="400" rx="100" ry="38" fill="#1f9e88" stroke="#136656" stroke-width="1.5"/>
    <text x="380" y="395" text-anchor="middle" font-size="13" fill="#ffffff">
      <tspan x="380" dy="0">Nhập tồn kho</tspan>
      <tspan x="380" dy="16">từ Excel</tspan>
    </text>

    <ellipse cx="600" cy="400" rx="100" ry="38" fill="#1f9e88" stroke="#136656" stroke-width="1.5"/>
    <text x="600" y="395" text-anchor="middle" font-size="13" fill="#ffffff">
      <tspan x="600" dy="0">Xem tồn kho</tspan>
      <tspan x="600" dy="16">theo loại thanh</tspan>
    </text>

    <ellipse cx="820" cy="400" rx="100" ry="38" fill="#1f9e88" stroke="#136656" stroke-width="1.5"/>
    <text x="820" y="395" text-anchor="middle" font-size="13" fill="#ffffff">
      <tspan x="820" dy="0">Cập nhật tồn</tspan>
      <tspan x="820" dy="16">kho thủ công</tspan>
    </text>

    <!-- Row 4 -->
    <ellipse cx="380" cy="520" rx="100" ry="38" fill="#1f9e88" stroke="#136656" stroke-width="1.5"/>
    <text x="380" y="515" text-anchor="middle" font-size="13" fill="#ffffff">
      <tspan x="380" dy="0">Sinh phương</tspan>
      <tspan x="380" dy="16">án cắt</tspan>
    </text>

    <ellipse cx="600" cy="520" rx="100" ry="38" fill="#1f9e88" stroke="#136656" stroke-width="1.5"/>
    <text x="600" y="515" text-anchor="middle" font-size="13" fill="#ffffff">
      <tspan x="600" dy="0">Xem / xuất kết</tspan>
      <tspan x="600" dy="16">quả cắt</tspan>
    </text>

    <ellipse cx="820" cy="520" rx="100" ry="38" fill="#1f9e88" stroke="#136656" stroke-width="1.5"/>
    <text x="820" y="515" text-anchor="middle" font-size="13" fill="#ffffff">
      <tspan x="820" dy="0">Quản lý định</tspan>
      <tspan x="820" dy="16">mức BOM</tspan>
    </text>

    <!-- Row 5 -->
    <ellipse cx="380" cy="640" rx="100" ry="38" fill="#1f9e88" stroke="#136656" stroke-width="1.5"/>
    <text x="380" y="635" text-anchor="middle" font-size="13" fill="#ffffff">
      <tspan x="380" dy="0">Nhập định mức</tspan>
      <tspan x="380" dy="16">BOM từ Excel</tspan>
    </text>

    <ellipse cx="600" cy="640" rx="100" ry="38" fill="#1f9e88" stroke="#136656" stroke-width="1.5"/>
    <text x="600" y="635" text-anchor="middle" font-size="13" fill="#ffffff">
      <tspan x="600" dy="0">Tra cứu định</tspan>
      <tspan x="600" dy="16">mức BOM</tspan>
    </text>

    <ellipse cx="820" cy="640" rx="100" ry="38" fill="#1f9e88" stroke="#136656" stroke-width="1.5"/>
    <text x="820" y="635" text-anchor="middle" font-size="13" fill="#ffffff">
      <tspan x="820" dy="0">Quản lý tài</tspan>
      <tspan x="820" dy="16">khoản người dùng</tspan>
    </text>
  </g>

  <!-- Actor: PLANNER -->
  <g stroke="#222222" stroke-width="2.5" fill="none">
    <circle cx="90" cy="360" r="16"/>
    <line x1="90" y1="376" x2="90" y2="430"/>
    <line x1="68" y1="392" x2="112" y2="392"/>
    <line x1="90" y1="430" x2="70" y2="470"/>
    <line x1="90" y1="430" x2="110" y2="470"/>
  </g>
  <text x="90" y="495" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">PLANNER</text>

  <!-- Actor: ADMIN -->
  <g stroke="#222222" stroke-width="2.5" fill="none">
    <circle cx="1110" cy="360" r="16"/>
    <line x1="1110" y1="376" x2="1110" y2="430"/>
    <line x1="1088" y1="392" x2="1132" y2="392"/>
    <line x1="1110" y1="430" x2="1090" y2="470"/>
    <line x1="1110" y1="430" x2="1130" y2="470"/>
  </g>
  <text x="1110" y="495" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">ADMIN</text>
</svg>
