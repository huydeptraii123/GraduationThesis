spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cutting_stock}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    web:
      pageable:
        # Chặn ?size=999999 kéo cả bảng về — mất tác dụng của phân trang và có thể làm sập bộ nhớ.
        max-page-size: 200

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-please-override-in-real-deployments-0123456789}
  expiration-ms: ${JWT_EXPIRATION_MS:28800000}
