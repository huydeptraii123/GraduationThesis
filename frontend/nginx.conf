server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /auth/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /api/ {
        # Khớp với spring.servlet.multipart.max-file-size của backend; mặc định của nginx là 1MB,
        # sẽ chặn file Excel tồn kho ngay tại proxy trước khi backend kịp xử lý.
        client_max_body_size 10m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
